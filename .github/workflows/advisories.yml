name: advisories

on:
  schedule:
  - cron: "5 23 * * *"
env:
  CARGO_TERM_COLOR: always

jobs:
  cargo-deny:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v7
      with:
        ref: main
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check advisories
