name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  tests:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7
    # The pin keeps new lints out of PRs. toolchain.yml checks latest stable weekly.
    - uses: dtolnay/rust-toolchain@1.99
      with:
        components: clippy, rustfmt
    - name: Run rustfmt
      run: cargo fmt --check
    - name: Run Clippy
      run: cargo clippy --all-targets --all-features
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose

  cargo-deny:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # New advisories against existing dependencies must not block PRs.
    # advisories.yml reports them for main.
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
    - uses: actions/checkout@v7
    - uses: EmbarkStudios/cargo-deny-action@v2
      with:
        command: check ${{ matrix.checks }}
